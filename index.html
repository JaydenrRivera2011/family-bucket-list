<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Family Bucket List</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f8f1e7;
      --card: #fffaf3;
      --text: #40352c;
      --muted: #806f61;
      --accent: #b56b45;
      --accent-dark: #8e4e30;
      --border: #e4d7c8;
      --green: #5f805d;
      --shadow: 0 10px 30px rgba(72, 51, 35, .10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,250,243,.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 24px;
      font-weight: bold;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: bold;
      font-size: 14px;
    }

    .menu-button {
      background: transparent;
      font-size: 25px;
    }

    .github-button {
      background: #24292f;
      color: white;
    }

    .logout-button {
      background: #eadfd3;
      color: var(--text);
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: var(--card);
      z-index: 20;
      padding: 25px;
      box-shadow: var(--shadow);
      transition: .25s;
    }

    .drawer.open {
      left: 0;
    }

    .drawer h2 {
      font-family: Georgia, serif;
    }

    .drawer button {
      display: block;
      width: 100%;
      margin: 10px 0;
      text-align: left;
      background: #f1e7da;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px 80px;
    }

    .hero {
      text-align: center;
      padding: 35px 10px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(40px, 8vw, 72px);
      margin: 10px 0;
    }

    .hero p {
      color: var(--muted);
      font-size: 18px;
    }

    .auth-card {
      max-width: 500px;
      margin: 25px auto;
      padding: 30px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .auth-card h2 {
      font-family: Georgia, serif;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      display: block;
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: bold;
    }

    .progress-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .progress-bar {
      height: 14px;
      background: #eadfd3;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width .4s;
    }

    .season-title {
      font-family: Georgia, serif;
      font-size: 34px;
      margin-bottom: 15px;
    }

    .activity-list {
      display: grid;
      gap: 12px;
    }

    .activity {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .activity input {
      width: 21px;
      height: 21px;
      accent-color: var(--green);
    }

    .activity-text {
      flex: 1;
    }

    .activity.done .activity-text {
      text-decoration: line-through;
      opacity: .55;
    }

    .who {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .message {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 25px;
      margin: 25px 0;
    }

    .add-box {
      display: flex;
      gap: 10px;
      margin: 25px 0;
    }

    .add-box input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      background: white;
    }

    .add-box button {
      background: var(--accent);
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .user-info {
      text-align: center;
      color: var(--muted);
      margin-top: 10px;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .activity {
        align-items: flex-start;
      }

      .add-box {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <button class="menu-button" onclick="toggleDrawer()">☰</button>

    <div class="logo">Family Bucket List</div>

    <button id="logoutBtn"
            class="logout-button hidden"
            onclick="logout()">
      Log Out
    </button>
  </div>
</header>

<div id="drawer" class="drawer">
  <button onclick="showSeason('spring')">🌷 Spring</button>
  <button onclick="showSeason('summer')">☀️ Summer</button>
  <button onclick="showSeason('fall')">🍂 Fall</button>
  <button onclick="showSeason('winter')">❄️ Winter</button>
</div>

<main>

  <section class="hero">
    <h1>Our Family Adventures</h1>
    <p>Little moments. Big memories. One bucket list.</p>
  </section>

  <!-- LOGIN -->
  <section id="loginSection" class="auth-card">
    <h2>Welcome!</h2>

    <p>
      Sign in with your GitHub account to access the family bucket list.
    </p>

    <button class="github-button" onclick="loginWithGitHub()">
      Continue with GitHub
    </button>

    <p id="authMessage" class="user-info"></p>
  </section>


  <!-- APP -->
  <section id="appSection" class="hidden">

    <div id="userInfo" class="user-info"></div>

    <div class="stats">
      <div class="stat">
        <span id="totalCount" class="stat-number">0</span>
        Total
      </div>

      <div class="stat">
        <span id="doneCount" class="stat-number">0</span>
        Completed
      </div>

      <div class="stat">
        <span id="percentCount" class="stat-number">0%</span>
        Progress
      </div>
    </div>

    <div class="progress-card">
      <strong>Family Progress</strong>

      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div id="completionMessage" class="message"></div>

    <div class="add-box">
      <input
        id="newActivity"
        type="text"
        placeholder="Add a new family adventure..."
      >

      <button onclick="addActivity()">
        + Add
      </button>
    </div>

    <h2 id="seasonTitle" class="season-title">
      🌷 Spring
    </h2>

    <div id="activityList" class="activity-list"></div>

  </section>

</main>

<script>

  // ============================================
  // SUPABASE
  // ============================================

  const SUPABASE_URL =
    "https://elprfpqivxmdrtvdtojh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_bgSXEqqOpsyKA9wdgeVkKA_B_WoD23b";

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ============================================
  // STATE
  // ============================================

  let currentUser = null;
  let currentSeason = "spring";

  const seasonNames = {
    spring: "🌷 Spring",
    summer: "☀️ Summer",
    fall: "🍂 Fall",
    winter: "❄️ Winter"
  };


  // ============================================
  // GITHUB LOGIN
  // ============================================

  async function loginWithGitHub() {

    const { error } =
      await db.auth.signInWithOAuth({

        provider: "github",

        options: {
          redirectTo:
            "https://jaydenrrivera2011.github.io/family-bucket-list/"
        }

      });

    if (error) {
      document.getElementById("authMessage").textContent =
        error.message;
    }
  }


  // ============================================
  // LOG OUT
  // ============================================

  async function logout() {

    await db.auth.signOut();

    currentUser = null;

    document
      .getElementById("appSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document
      .getElementById("logoutBtn")
      .classList.add("hidden");
  }


  // ============================================
  // AUTH STATE
  // ============================================

  db.auth.onAuthStateChange(
    async (event, session) => {

      if (session && session.user) {

        currentUser = session.user;

        document
          .getElementById("loginSection")
          .classList.add("hidden");

        document
          .getElementById("appSection")
          .classList.remove("hidden");

        document
          .getElementById("logoutBtn")
          .classList.remove("hidden");

        const username =
          getUsername(session.user);

        document.getElementById("userInfo").textContent =
          "Signed in as " + username;

        await loadActivities();

      } else {

        currentUser = null;

        document
          .getElementById("loginSection")
          .classList.remove("hidden");

        document
          .getElementById("appSection")
          .classList.add("hidden");

        document
          .getElementById("logoutBtn")
          .classList.add("hidden");
      }
    }
  );


  // ============================================
  // GET GITHUB USERNAME
  // ============================================

  function getUsername(user) {

    return (
      user.user_metadata?.user_name ||
      user.user_metadata?.preferred_username ||
      user.user_metadata?.name ||
      user.email?.split("@")[0] ||
      "Family Member"
    );
  }


  // ============================================
  // DRAWER
  // ============================================

  function toggleDrawer() {

    document
      .getElementById("drawer")
      .classList.toggle("open");
  }


  function showSeason(season) {

    currentSeason = season;

    document
      .getElementById("drawer")
      .classList.remove("open");

    document
      .getElementById("seasonTitle")
      .textContent = seasonNames[season];

    loadActivities();
  }


  // ============================================
  // LOAD ACTIVITIES
  // ============================================

  async function loadActivities() {

    if (!currentUser) return;

    const { data, error } =
      await db
        .from("activities")
        .select("*")
        .eq("season", currentSeason)
        .order("created_at", {
          ascending: true
        });

    if (error) {

      console.error(error);

      document.getElementById("activityList").innerHTML =
        "<p>Could not load activities.</p>";

      return;
    }

    renderActivities(data || []);

    updateStats(data || []);
  }


  // ============================================
  // RENDER
  // ============================================

  function renderActivities(activities) {

    const list =
      document.getElementById("activityList");

    list.innerHTML = "";

    if (activities.length === 0) {

      list.innerHTML =
        "<p>No activities yet. Add one above!</p>";

      return;
    }

    activities.forEach(activity => {

      const item =
        document.createElement("div");

      item.className =
        "activity" +
        (activity.done ? " done" : "");

      const checkbox =
        document.createElement("input");

      checkbox.type = "checkbox";
      checkbox.checked = activity.done;

      checkbox.onchange = () =>
        toggleActivity(activity);

      const text =
        document.createElement("div");

      text.className = "activity-text";

      text.textContent = activity.text;

      const who =
        document.createElement("div");

      who.className = "who";

      if (activity.done) {

        who.textContent =
          "Completed by " +
          (activity.completed_by_username ||
           "Family Member");

      } else {

        who.textContent =
          "Added by " +
          (activity.created_by_username ||
           "Family Member");
      }

      text.appendChild(who);

      item.appendChild(checkbox);
      item.appendChild(text);

      list.appendChild(item);
    });
  }


  // ============================================
  // ADD ACTIVITY
  // ============================================

  async function addActivity() {

    const input =
      document.getElementById("newActivity");

    const text =
      input.value.trim();

    if (!text || !currentUser) return;

    const username =
      getUsername(currentUser);

    const { error } =
      await db
        .from("activities")
        .insert({

          season: currentSeason,

          text: text,

          done: false,

          created_by: currentUser.id,

          created_by_username: username
        });

    if (error) {

      alert(error.message);

      return;
    }

    input.value = "";

    await loadActivities();
  }


  // ============================================
  // COMPLETE / UNCOMPLETE
  // ============================================

  async function toggleActivity(activity) {

    if (!currentUser) return;

    const username =
      getUsername(currentUser);

    let updateData;

    if (!activity.done) {

      updateData = {

        done: true,

        completed_at:
          new Date().toISOString(),

        completed_by:
          currentUser.id,

        completed_by_username:
          username
      };

    } else {

      updateData = {

        done: false,

        completed_at: null,

        completed_by: null,

        completed_by_username: null
      };
    }

    const { error } =
      await db
        .from("activities")
        .update(updateData)
        .eq("id", activity.id);

    if (error) {

      alert(error.message);

      return;
    }

    await loadActivities();
  }


  // ============================================
  // STATS
  // ============================================

  async function updateStats(currentSeasonActivities) {

    const { data: allActivities, error } =
      await db
        .from("activities")
        .select("done");

    if (error) return;

    const total =
      allActivities.length;

    const completed =
      allActivities.filter(a => a.done).length;

    const percent =
      total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("totalCount")
      .textContent = total;

    document.getElementById("doneCount")
      .textContent = completed;

    document.getElementById("percentCount")
      .textContent = percent + "%";

    document.getElementById("progressFill")
      .style.width = percent + "%";

    const message =
      document.getElementById("completionMessage");

    if (total > 0 && percent === 100) {

      message.textContent =
        "🎉 We did everything! What an amazing family adventure!";

    } else {

      message.textContent = "";
    }
  }


  // ============================================
  // ENTER KEY TO ADD
  // ============================================

  document
    .getElementById("newActivity")
    .addEventListener("keydown", event => {

      if (event.key === "Enter") {
        addActivity();
      }

    });

</script>

</body>
</html>
